syntax = "proto3";

option java_multiple_files = true;
option java_package = "edu.eci.arsw.eciciencia";

// Enums

enum ActivityType {
    TALK = 0;
    WORKSHOP = 1;
    EXPERIENCE = 2;
}

// AttendeeService

message RegisterRequest {
    string name = 1;
    string institutional_email = 2;
}

message RegisterResponse {
    bool success = 1;
    string attendee_id = 2;
    string message = 3;
}

message AttendeeIdRequest {
    string attendee_id = 1;
}

message AttendeeInfo {
    string id = 1;
    string name = 2;
    string email = 3;
}

service AttendeeService {
    rpc RegisterAttendee(RegisterRequest) returns (RegisterResponse);
    rpc GetAttendee(AttendeeIdRequest) returns (AttendeeInfo);
}

// AgendaService

message ScheduleRequest {
    string time_slot = 1;
}

message ActivityIdRequest {
    string activity_id = 1;
}

message Activity {
    string id = 1;
    string title = 2;
    string speaker = 3;
    string time_slot = 4;
    string location = 5;
    ActivityType type = 6;
    int32 capacity = 7;
}

message ActivityList {
    repeated Activity activities = 1;
}

service AgendaService {
    rpc GetSchedule(ScheduleRequest) returns (ActivityList);
    rpc GetActivity(ActivityIdRequest) returns (Activity);
}

// WorkshopService

message BookingRequest {
    string attendee_id = 1;
    string activity_id = 2;
}

message BookingResponse {
    bool success = 1;
    string message = 2;
    string booking_id = 3;
}

message CancelBookingRequest {
    string booking_id = 1;
}

message CancelBookingResponse {
    bool success = 1;
    string message = 2;
}

message AvailabilityResponse {
    string activity_id = 1;
    int32 total_capacity = 2;
    int32 reserved_spots = 3;
    int32 available_spots = 4;
}

service WorkshopService {
    rpc BookWorkshop(BookingRequest) returns (BookingResponse);
    rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
    rpc GetAvailability(ActivityIdRequest) returns (AvailabilityResponse);
}

// CapacityService

message CheckInRequest {
    string attendee_id = 1;
    string activity_id = 2;
}

message CheckInResponse {
    bool success = 1;
    string message = 2;
}

message CapacityResponse {
    string activity_id = 1;
    int32 current_attendance = 2;
    int32 max_capacity = 3;
    bool at_capacity = 4;
}

service CapacityService {
    rpc CheckIn(CheckInRequest) returns (CheckInResponse);
    rpc GetCapacity(ActivityIdRequest) returns (CapacityResponse);
}

// EciGateway

message AttendeeSummaryRequest {
    string attendee_id = 1;
}

message AttendeeSummaryResponse {
    AttendeeInfo attendee = 1;
    repeated string booked_workshops = 2;
    repeated string attended_activities = 3;
}

service EciGateway {
    rpc RegisterAttendee(RegisterRequest) returns (RegisterResponse);
    rpc GetSchedule(ScheduleRequest) returns (ActivityList);
    rpc BookWorkshop(BookingRequest) returns (BookingResponse);
    rpc GetAttendeeSummary(AttendeeSummaryRequest) returns (AttendeeSummaryResponse);
}
