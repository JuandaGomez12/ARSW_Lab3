syntax = "proto3";

option java_multiple_files = true;
option java_package = "edu.eci.arsw.wellness.appointment";
option java_outer_classname = "AppointmentProto";

enum AppointmentServiceType {
    MEDICINE = 0;
    PSYCHOLOGY = 1;
    DENTISTRY = 2;
}

enum AppointmentStatus {
    REQUESTED = 0;
    CANCELLED = 1;
    ATTENDED = 2;
}

message AppointmentRequest {
    string student_id = 1;
    AppointmentServiceType service_type = 2;
    string date = 3;
}

message AppointmentResponse {
    bool success = 1;
    string message = 2;
    string appointment_id = 3;
}

message CancelRequest {
    string appointment_id = 1;
}

message CancelResponse {
    bool success = 1;
    string message = 2;
}

message StudentRequest {
    string student_id = 1;
}

message AppointmentInfo {
    string id = 1;
    string student_id = 2;
    AppointmentServiceType service_type = 3;
    string date = 4;
    AppointmentStatus status = 5;
}

message AppointmentList {
    repeated AppointmentInfo appointments = 1;
}

service AppointmentService {
    rpc RequestAppointment(AppointmentRequest) returns (AppointmentResponse);
    rpc CancelAppointment(CancelRequest) returns (CancelResponse);
    rpc GetAppointments(StudentRequest) returns (AppointmentList);
}
